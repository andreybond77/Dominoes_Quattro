<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dominoes-Quattro — Игра</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>Dominoes-Quattro</h1>
            <div class="header-buttons">
                <button class="btn btn-sound" id="soundBtn" title="Звук вкл/выкл">🔊</button>
                <button class="btn btn-exit" id="exitBtn">✕</button>
            </div>
        </div>

        <div class="board-wrapper">
            <div class="board" id="board"></div>
        </div>

        <div class="hand-container" id="handContainer">
            <div class="hand-label">
                <span class="hand-score hand-score-player">
                    🧑 Игрок: <span id="playerScoreDisplay">0</span>
                </span>
                <span class="hand-score hand-score-computer">
                    💻 Компьютер: <span id="computerScoreDisplay">0</span>
                </span>
            </div>

            <div class="add-tile-row">
                <button class="btn-add-tile" id="addTileBtn" title="Взять костяшку из колоды">+</button>
            </div>

            <div class="hand-tiles-wrapper">
                <button class="btn-rotate" id="rotateCWBtn" title="Поворот по часовой">↺</button>
                <button class="btn-scroll btn-scroll-left" id="scrollLeftBtn" title="Влево">◀</button>

                <div class="hand-tiles-slider" id="handSlider">
                    <div class="hand-tiles-track" id="handTilesTrack"></div>
                </div>

                <button class="btn-scroll btn-scroll-right" id="scrollRightBtn" title="Вправо">▶</button>
                <button class="btn-rotate" id="rotateCCWBtn" title="Поворот против часовой">↻</button>
            </div>
        </div>

        <div class="message-area" id="messageArea"></div>
    </div>

    <script src="../js/game.js"></script>
    <script src="../js/ui.js"></script>
</body>
</html>
