<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dominoes-Quattro — Сложность</title>
    <link rel="stylesheet" href="../css/difficulty.css">
</head>
<body>
    <div class="page-container">
        <div class="page-header">
            <h1 class="page-title"> Сложность</h1>
            <button class="btn-back-menu" id="backBtn">✕</button>
        </div>

        <div class="difficulty-list">
            <div class="difficulty-card easy" data-level="easy">
                <div class="difficulty-name">🟢 Лёгкая</div>
                <div class="difficulty-desc">Компьютер ходит случайно. Идеально для новичков.</div>
            </div>

            <div class="difficulty-card medium" data-level="medium">
                <div class="difficulty-name">🟡 Средняя</div>
                <div class="difficulty-desc">Компьютер ставит костяшку с максимальным количеством совпадений.</div>
            </div>

            <div class="difficulty-card hard" data-level="hard">
                <div class="difficulty-name">🔴 Сложная</div>
                <div class="difficulty-desc">Компьютер просчитывает ходы на несколько шагов вперёд и учитывает ваши ответы.</div>
            </div>
        </div>
    </div>

    <script src="../js/difficulty.js"></script>
</body>
</html>
